<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 背景：深い青のグラデーション＋上から光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cff"/>
      <stop offset="0.55" stop-color="#2238c9"/>
      <stop offset="1" stop-color="#14157a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- コイン -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.45" stop-color="#f7c23a"/>
      <stop offset="1" stop-color="#b9740f"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.6" stop-color="#f5b52a"/>
      <stop offset="1" stop-color="#d48a12"/>
    </radialGradient>
    <linearGradient id="yen" gradientUnits="userSpaceOnUse" x1="0" y1="318" x2="0" y2="620">
      <stop offset="0" stop-color="#a8620a"/>
      <stop offset="1" stop-color="#7a4306"/>
    </linearGradient>
    <!-- 時計 -->
    <linearGradient id="clock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6f5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#060a3a" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#060a3a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- 背景の飾り：うすい同心円 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <circle cx="470" cy="470" r="400"/>
    <circle cx="470" cy="470" r="470"/>
  </g>

  <!-- 金色のコイン -->
  <g filter="url(#shadow)">
    <circle cx="460" cy="460" r="300" fill="url(#rim)"/>
    <circle cx="460" cy="460" r="262" fill="url(#face)"/>
    <circle cx="460" cy="460" r="232" fill="none" stroke="#c98510" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>
    <!-- 円記号：影（彫り込み）→本体→ハイライト -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#fff3b0" stroke-opacity="0.7" stroke-width="58" transform="translate(4 6)">
        <path d="M352 318 L460 458 L568 318"/><path d="M460 458 L460 620"/><path d="M378 490 L542 490"/><path d="M378 560 L542 560"/>
      </g>
      <g stroke="url(#yen)" stroke-width="58">
        <path d="M352 318 L460 458 L568 318"/><path d="M460 458 L460 620"/><path d="M378 490 L542 490"/><path d="M378 560 L542 560"/>
      </g>
    </g>
    <!-- コインのつや -->
    <path d="M250 360 A230 230 0 0 1 420 222" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- 時計（時給のイメージ） -->
  <g filter="url(#soft)">
    <circle cx="742" cy="742" r="176" fill="#0d1a8f"/>
    <circle cx="742" cy="742" r="150" fill="url(#clock)"/>
    <g stroke="#9aa8c9" stroke-width="10" stroke-linecap="round">
      <path d="M742 612 L742 634"/><path d="M872 742 L850 742"/><path d="M742 872 L742 850"/><path d="M612 742 L634 742"/>
    </g>
    <path d="M742 742 L742 660" stroke="#1b2a8c" stroke-width="20" stroke-linecap="round"/>
    <path d="M742 742 L806 778" stroke="#2f6bff" stroke-width="16" stroke-linecap="round"/>
    <circle cx="742" cy="742" r="16" fill="#1b2a8c"/>
  </g>
</svg>
