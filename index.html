<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="給料計算">
  <title>給料計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- ===== 給料 ===== -->
    <section id="tab-pay" class="panel active">
      <div class="nav">
        <button class="arrow" id="prev" aria-label="前の月">‹</button>
        <div id="monthTitle" class="nav-title"></div>
        <button class="arrow" id="next" aria-label="次の月">›</button>
      </div>

      <div class="hero">
        <div id="total" class="big"></div>
        <div id="totalSub" class="muted"></div>
      </div>

      <details class="group">
        <summary>内訳</summary>
        <dl id="breakdown" class="rows"></dl>
      </details>

      <button class="add" id="openAdd">＋ シフトを追加</button>
      <ul id="shiftList" class="group list"></ul>

      <div class="label" id="yearLabel"></div>
      <div id="yearBox" class="group"></div>
    </section>

    <!-- ===== 設定 ===== -->
    <section id="tab-settings" class="panel">
      <form id="settingsForm" autocomplete="off">
        <div class="label">時給</div>
        <div class="group">
          <div id="wageRows"></div>
          <button type="button" class="link" id="addWage">＋ 時給を追加</button>
        </div>

        <div class="label">交通費（1日・往復）</div>
        <div class="group">
          <div id="transRows"></div>
          <button type="button" class="link" id="addTrans">＋ 交通費を追加</button>
        </div>
        <p class="hint">金額を変えても、入力済みのシフトは変わりません。</p>

        <details class="group">
          <summary>詳しい設定</summary>
          <label class="row">深夜割増<input type="checkbox" name="night.enabled"></label>
          <label class="row">深夜の時間<span class="unit"><input type="time" name="night.start">〜<input type="time" name="night.end"></span></label>
          <label class="row">深夜の割増率<span class="unit"><input type="number" name="night.ratePct" min="0" inputmode="numeric">%</span></label>
          <label class="row">残業割増<input type="checkbox" name="overtime.enabled"></label>
          <label class="row">残業になる時間<span class="unit">1日<input type="number" name="overtime.thresholdHours" min="1" step="0.5" inputmode="decimal">時間超</span></label>
          <label class="row">残業の割増率<span class="unit"><input type="number" name="overtime.ratePct" min="0" inputmode="numeric">%</span></label>
          <label class="row">深夜かつ残業の割増率<span class="unit"><input type="number" name="nightOvertime.ratePct" min="0" inputmode="numeric">%</span></label>
          <label class="row">交通費の出し方
            <select name="transport.mode">
              <option value="daily">出勤日ごとに選ぶ</option>
              <option value="monthly">毎月定額</option>
              <option value="none">なし</option>
            </select>
          </label>
          <label class="row">定額の場合<span class="unit"><input type="number" name="transport.monthly" min="0" inputmode="numeric">円</span></label>
          <label class="row">締め日<select name="closingDay" id="closingDay"></select></label>
          <label class="row">支給日
            <span class="unit">
              <select name="payMonthOffset"><option value="0">当月</option><option value="1">翌月</option><option value="2">翌々月</option></select>
              <input type="number" name="payDay" min="1" max="31" inputmode="numeric" class="short">日
            </span>
          </label>
        </details>

        <details class="group">
          <summary>年収の壁</summary>
          <div id="wallRows"></div>
          <button type="button" class="link" id="addWall">＋ 追加</button>
        </details>
      </form>

      <details class="group">
        <summary>データ</summary>
        <button type="button" class="link" id="exportCsv">CSVで書き出す</button>
        <button type="button" class="link" id="exportJson">バックアップを保存</button>
        <label class="link">バックアップから戻す<input type="file" id="importJson" accept="application/json,.json" hidden></label>
        <button type="button" class="link danger" id="resetAll">すべて消す</button>
      </details>
      <p class="hint center">データはこのブラウザの中だけに保存されます。</p>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="pay">給料</button>
    <button class="tab" data-tab="settings">設定</button>
  </nav>

  <!-- シフト入力 -->
  <dialog id="sheet">
    <form id="shiftForm" autocomplete="off">
      <div class="sheet-head">
        <button type="button" class="link" id="closeSheet">キャンセル</button>
        <strong id="formTitle"></strong>
        <button type="submit" class="link strong">保存</button>
      </div>
      <input type="hidden" name="sid">
      <div id="wagePickBox"><div class="label">時給</div><div id="wagePick" class="seg"></div></div>
      <div id="transPickBox"><div class="label">交通費</div><div id="transPick" class="seg"></div></div>
      <div class="group">
        <label class="row">日付<input type="date" name="date" required></label>
        <label class="row">出勤<input type="time" name="start" required></label>
        <label class="row">退勤<input type="time" name="end" required></label>
        <label class="row">休憩<span class="unit"><input type="number" name="breakMin" min="0" step="5" inputmode="numeric" value="0">分</span></label>
      </div>
      <div id="preview" class="preview"></div>
      <button type="button" class="link danger solo" id="deleteBtn" hidden>このシフトを削除</button>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
